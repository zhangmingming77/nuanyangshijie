<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>暖阳视界 - 盲道路况播报</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;color:#fff;font-family:system-ui}
#status{padding:8px;font-size:16px;text-align:center}
#btnStart{width:100%;padding:18px;font-size:20px;background:#2563eb;color:white;border:none}
#wrap{position:relative}
video{width:100%;display:block;object-fit:cover}
canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
#log{height:180px;overflow-y:auto;padding:10px;font-size:14px;background:#222;white-space:pre-wrap}
</style>
</head>
<body>
<div id="status">点击下方按钮开启</div>
<button id="btnStart">🔊 点击开启语音播报</button>
<div id="wrap">
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
</div>
<div id="log">— 暖阳视界 启动中 —</div>

<script>
const targetClasses = ["person","bicycle","car","motorcycle","bus","truck","fire hydrant","traffic light","stop sign","bench","parking meter","potted plant","dog","cat"];
const CLASS_CN = {person:"行人",bicycle:"自行车",car:"汽车",motorcycle:"摩托车",bus:"公交车",truck:"卡车","fire hydrant":"消防栓","traffic light":"红绿灯","stop sign":"停车标志",bench:"长椅","parking meter":"停车计时器","potted plant":"盆栽",dog:"狗",cat:"猫"};
const KNOWN = {person:1.7,bicycle:1.0,car:1.5,motorcycle:1.2,bus:3,truck:3,"fire hydrant":0.9,"traffic light":2.5,"stop sign":1,bench:0.8,"parking meter":1.2,"potted plant":0.6,dog:0.5,cat:0.3};
const VFOV = 50 * Math.PI / 180;
const DANGER = 3;
const COOLDOWN = 3500;

const video=document.getElementById('video');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const logDiv=document.getElementById('log');
const statusDiv=document.getElementById('status');
const btn=document.getElementById('btnStart');

let model=null;
let track=new Map();
let isVoice=false;

class VQ{constructor(){this.q=[];this.p=false;}speak(t){this.q.push(t);if(!this.p)this.go();}go(){if(!this.q.length){this.p=false;return;}this.p=true;const u=new SpeechSynthesisUtterance(this.q.shift());u.lang='zh-CN';u.rate=1.0;u.onend=()=>{setTimeout(()=>this.go(),200)};speechSynthesis.speak(u);}}
const vq=new VQ();

function log(m){const d=new Date();logDiv.innerText+=`[${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}] ${m}\n`;logDiv.scrollTop=logDiv.scrollHeight;}

function clockDir(nx){const dx=(nx-0.5)*2;const a=dx*90;let c=Math.round(a/30);if(c===0)return 12;if(c>0)return c;return 12+c;}

function getDist(cls,h,vh){const known=KNOWN[cls]||1;const fp=(vh/2)/Math.tan(VFOV/2);if(h<=0)return 99;return (known*fp)/h;}

async function loop(){
  if(!model||!video.srcObject)return;
  try{
    const preds=await model.detect(video,30,0.4,0.5);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const vw=video.videoWidth, vh=video.videoHeight;
    canvas.width=vw; canvas.height=vh;
    const now=Date.now();
    for(const o of preds){
      const cls=o.class;
      if(targetClasses.indexOf(cls)<0)continue;
      const b=o.bbox, x=b[0], y=b[1], w=b[2], h=b[3];
      const nx=(x+w/2)/vw, ny=(y+h/2)/vh;
      const dist=getDist(cls,h,vh);
      const danger=dist<DANGER;
      const dir=clockDir(nx);
      const clockName=dir===12?'12点钟':dir+'点钟';
      const cn=CLASS_CN[cls]||cls;
      // 画框
      ctx.strokeStyle=danger?'#ff3333':'#ffdd00';
      ctx.lineWidth=3; ctx.strokeRect(x,y,w,h);
      ctx.font='16px sans-serif';
      ctx.fillStyle=danger?'#ff3333':'#ffdd00';
      ctx.fillText(`${cn} ${dist.toFixed(1)}m`,x,y-6);
      // 防抖，同一物体只报一次
      const id=cls+'_'+Math.round(nx*10)+'_'+Math.round(ny*10);
      if(now-(track.get(id)||0)>=COOLDOWN){
        track.set(id,now);
        const prefix=danger?'危险！':'';
        const txt=`${prefix}${clockName}方向，${dist.toFixed(1)}米，${cn}`;
        vq.speak(txt);
        log((danger?'⚠️ 危险 ':'📍 ')+txt);
      }
    }
    for(const [k,t] of track){if(now-t>COOLDOWN*3)track.delete(k);}
  }catch(e){log('识别出错:'+e.message);}
  setTimeout(loop,600);
}

btn.onclick=async()=>{
  if(!isVoice){vq.speak('语音已开启，暖阳视界开始播报');isVoice=true;}
  statusDiv.innerText='正在开启摄像头…';
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject=stream;
    statusDiv.innerText='正在加载模型…';
    model=await cocoSsd.load();
    statusDiv.innerText='✅ 运行中，识别盲道物体并播报';
    log('✅ 模型加载完成，盲道模式');
    loop();
  }catch(e){
    statusDiv.innerText='出错了:'+e.message;
    log('错误:'+e.message);
  }
};
</script>
</body>
</html>
