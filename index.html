<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>暖阳视界 · 盲道路况AI播报</title>
<style>
:root{
 --bg:#07090d;--bg-2:#0c1016;
 --panel:rgba(255,255,255,0.06);--panel-2:rgba(255,255,255,0.04);
 --line:rgba(255,255,255,0.08);--line-strong:rgba(255,255,255,0.14);
 --txt:#f6f8fb;--txt-2:#9aa7b8;--txt-3:#6b7789;
 --sun:#ff9f2e;--sun-soft:#ffd8a8;--sun-glow:rgba(255,159,46,0.35);
 --ok:#2ecc8f;--ok-bg:rgba(46,204,143,0.12);
 --warn:#ffb066;--warn-bg:rgba(255,176,102,0.14);
 --danger:#ff5a5c;--danger-bg:rgba(255,90,92,0.16);
 --radius:22px;--radius-sm:14px;
 --shadow:0 20px 40px rgba(0,0,0,0.35);--shadow-soft:0 10px 24px rgba(0,0,0,0.25);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
 background:radial-gradient(1200px 500px at 80% -10%,rgba(255,159,46,0.12),transparent 60%),
   radial-gradient(900px 400px at 10% 110%,rgba(46,204,143,0.08),transparent 60%),
   linear-gradient(180deg,#07090d,#0c1016);
 color:var(--txt);font-family:system-ui,sans-serif;
 display:flex;flex-direction:column;min-height:100vh;
 padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
}
.wrap{flex:1;display:flex;flex-direction:column;max-width:640px;margin:0 auto;width:100%;padding:14px;gap:14px}
header{display:flex;align-items:center;gap:12px;padding:6px 4px}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.logo{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,#ffb45e,#ff9f2e);
 display:grid;place-items:center;color:#3a2400;box-shadow:0 8px 20px var(--sun-glow);font-size:22px}
.brand h1{font-size:20px;font-weight:800;letter-spacing:.5px}
.brand p{font-size:12px;color:var(--txt-2);margin-top:3px}
.status-dot{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--txt-2);
 background:var(--panel);border:1px solid var(--line);padding:8px 12px;border-radius:999px;backdrop-filter:blur(10px)}
.status-dot .dot{width:9px;height:9px;border-radius:50%;background:var(--txt-3);transition:background .3s,box-shadow .3s}
.status-dot.on{color:#ffe1b0;border-color:rgba(255,159,46,0.35);background:rgba(255,159,46,0.1)}
.status-dot.on .dot{background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
#dangerBanner{display:none;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(255,90,92,0.18),rgba(255,90,92,0.08));
 border:1px solid rgba(255,90,92,0.35);color:#ffd6d6;padding:14px 16px;border-radius:var(--radius);
 font-size:16px;font-weight:800;box-shadow:var(--shadow-soft)}
#dangerBanner.show{display:flex;animation:dangerIn .25s ease-out}
#dangerBanner .icon{width:30px;height:30px;color:var(--danger);animation:blink 1s infinite;font-size:22px}
@keyframes dangerIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
#camBox{position:relative;border-radius:var(--radius);overflow:hidden;background:#000;border:1px solid var(--line);box-shadow:var(--shadow);touch-action:none;background-color:#000}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:rgba(10,14,20,0.9);border:1px solid var(--line-strong);color:var(--txt);padding:10px 22px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;white-space:nowrap}
#toast.show{opacity:1}
#toast.pause{color:#ffd8a8;border-color:rgba(255,159,46,0.4)}
video{width:100%;display:block;aspect-ratio:4/3;object-fit:cover;background:#000}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#camPlaceholder{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--txt-2);padding:24px;gap:10px}
#camPlaceholder svg{width:58px;height:58px;color:#3a4556}
#camPlaceholder b{display:block;color:var(--txt);font-size:17px}
#camPlaceholder span{font-size:13px;color:var(--txt-2)}
#camBox.live #camPlaceholder{display:none}
#nowCard{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);
 border-radius:var(--radius);padding:16px;min-height:74px;backdrop-filter:blur(14px);box-shadow:var(--shadow-soft)}
#nowIcon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--txt-2);background:var(--panel-2)}
#nowIcon svg{width:22px;height:22px}
#nowIcon.danger{background:var(--danger-bg);color:var(--danger)}
#nowIcon.warn{background:var(--warn-bg);color:var(--warn)}
#nowIcon.ok{background:var(--ok-bg);color:var(--ok)}
#nowText{flex:1;min-width:0}
#nowText .t{font-size:18px;font-weight:800;line-height:1.3}
#nowText .s{font-size:13px;color:var(--txt-2);margin-top:4px}
#aiTip{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,rgba(255,159,46,0.14),rgba(255,159,46,0.04));
 border:1px solid rgba(255,159,46,0.28);color:var(--sun-soft);padding:14px 16px;border-radius:var(--radius);
 font-size:14px;line-height:1.6;box-shadow:var(--shadow-soft)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:82px;padding:14px;
 border:none;border-radius:18px;cursor:pointer;color:#fff;font-weight:800;font-size:16px;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn svg{width:24px;height:24px}
.btn .sub{font-size:11px;font-weight:600;opacity:.8}
.btn-primary{background:linear-gradient(135deg,#ffb45e,#ff9f2e);color:#3a2400;box-shadow:0 12px 24px var(--sun-glow)}
.btn-primary.running{background:linear-gradient(135deg,#2ecc8f,#1fb47c);color:#05241a;box-shadow:0 12px 24px rgba(46,204,143,0.28)}
.btn-nav{background:linear-gradient(135deg,#13a8b8,#0e8ca6);box-shadow:0 12px 24px rgba(14,140,166,0.25)}
#sosWrap{margin-top:auto}
#sosBtn{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;min-height:68px;padding:16px;
 border:none;border-radius:18px;cursor:pointer;background:linear-gradient(135deg,#ff5a5c,#e13b3d);color:#fff;
 font-weight:800;font-size:19px;box-shadow:0 10px 24px rgba(225,59,61,0.35);transition:transform .08s}
#sosBtn:active{transform:scale(.98)}
#sosBtn svg{width:24px;height:24px}
#sosHint{text-align:center;font-size:12px;color:var(--txt-2);margin-top:8px}
#logHead{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);
 border-bottom:none;border-radius:16px 16px 0 0;padding:10px 14px;font-size:13px;color:var(--txt-2);cursor:pointer}
#logHead b{color:var(--txt);font-size:14px;font-weight:700}
#logHead .chev{transition:transform .2s;font-size:10px}
#logBody{max-height:0;overflow:hidden;transition:max-height .3s ease}
#logBody.open{max-height:240px}
#log{height:200px;overflow-y:auto;padding:12px 14px;font-size:13px;background:var(--panel);border:1px solid var(--line);
 border-radius:0 0 16px 16px;color:#c7d2e0;white-space:pre-wrap}
#log .danger{color:#ff8f90}#log .warn{color:#ffb066}#log .ok{color:#7fe3bd}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--txt-2);padding:0 2px}
.legend i{display:inline-block;width:20px;height:0;border-top-width:2px;border-top-style:solid;vertical-align:middle;margin-right:6px}
.log-actions{display:inline-flex;align-items:center;gap:10px}
#btnTest{border:1px solid rgba(255,159,46,0.35);background:rgba(255,159,46,0.1);color:#ffd8a8;font-size:12px;font-weight:700;
 padding:4px 12px;border-radius:999px;cursor:pointer}
#btnTest:active{transform:scale(.95)}
@media (min-width:768px){.wrap{padding:24px}video{aspect-ratio:16/9}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">🌞</div>
      <div style="flex:1;min-width:0">
        <h1>暖阳视界</h1>
        <p>盲道路况 AI 播报</p>
      </div>
    </div>
    <div class="status-dot" id="statusDot"><span class="dot"></span><span id="statusText">待开启</span></div>
  </header>
  <div id="dangerBanner"><span class="icon">⚠️</span><span id="dangerText">危险！</span></div>
  <div id="camBox">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div id="camPlaceholder">
      <div>
        <b>摄像头待开启</b>
        <span style="display:block">点击下方「开启播报」开始识别路况</span>
        <span style="display:block">只识别重要障碍 · 行人车辆</span>
      </div>
    </div>
  </div>
  <div id="nowCard">
    <div id="nowIcon">🔍</div>
    <div id="nowText"><div class="t" id="nowTitle">等待开启</div><div class="s" id="nowSub">开启后实时播报前方路况</div></div>
  </div>
  <div id="aiTip">AI安全解说：只播报近处重要障碍，减少语音打扰。双击暂停/继续，画面上滑导航，下滑紧急呼叫。</div>
  <div class="controls">
    <button class="btn btn-primary" id="btnStart"><span id="btnStartText">开启播报</span><span id="btnStartSub" class="sub">识别重要障碍</span></button>
    <button class="btn btn-nav" id="btnNav"><span>一键导航</span><span class="sub">打开高德地图</span></button>
  </div>
  <div id="sosWrap">
    <button id="sosBtn">📞 紧急呼叫亲人</button>
    <p id="sosHint">点击拨打 · 长按改联系人 · 画面上滑导航 · 下滑紧急呼叫</p>
  </div>
  <div>
    <div id="logHead" role="button" tabindex="0" aria-expanded="false"><b>运行日志</b><span class="log-actions"><button id="btnTest">🔊 测试声音</button><span class="chev">▾</span></span></div>
    <div id="logBody"><div id="log">— 暖阳视界已就绪，点击开启播报 —</div></div>
    <div class="legend"><span><i style="border-top-color:#ff4d4f"></i>危险</span><span><i style="border-top-color:#ffce54"></i>注意</span><span><i style="border-top-color:#2ecc8f"></i>安全</span></div>
  </div>
</div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
<script>
(function(){
"use strict";
/* ============================================================
   常量
   ============================================================ */
/* 【精简】只保留对盲人行走真正重要的障碍类别：行人 + 各种车辆 */
const targetClasses=["person","bicycle","car","motorcycle","bus","truck"];
const CLASS_CN={ person:"行人",bicycle:"自行车",car:"汽车",motorcycle:"摩托车",bus:"公交车",truck:"卡车" };
const KNOWN={ person:1.65,bicycle:1.1,car:1.6,motorcycle:1.2,bus:3.5,truck:3.5 };
const VFOV=52*Math.PI/180;
const DANGER=3;                 // COCO物体危险距离(米)
const DANGER_BOX_RATIO=0.28;    // COCO物体占画面比例危险阈值
const SPEAK_DIST=6;             // 【新增】只有正前方 6 米内的障碍才播报语音
const COOLDOWN=10000;           // 【调慢】同一障碍重复播报冷却(ms) 原5000→10000
const AI_INTERVAL=60000;        // 【调慢】AI解说间隔(ms) 原25000→60000，少打扰
const LOOP_DELAY=120;
/* ====== 【新增】障碍框跟踪锁定：跨帧匹配 + 位置平滑，让框稳稳粘住障碍物不乱跳 ====== */
const TRACK_CONFIRM_MIN=3;      // 新障碍连续稳定出现 3 帧才绘制/播报，滤掉一闪而过的噪点框
const TRACK_LOST_TIMEOUT=700;   // 障碍短暂丢失仍保留框(ms)，避免框闪断
const TRACK_SMOOTH=0.55;        // 框位置平滑系数(越大越稳、越滞后)
const TRACK_IOU_MATCH=0.3;      // 跨帧匹配 IoU 阈值(高→只匹配同一个障碍)
/* 【扇形收窄】改为十二点钟方向窄扇形（11点~1点）：只播报正前方障碍，减少侧方误报 */
const FRONT_START=11,FRONT_END=1;
/* ============================================================
   背景建模 + 帧间运动检测
   ============================================================ */
const BLOCK=10;
const BG_DIFF_THRESHOLD=32;     // 【调高】原26→32，降低背景噪声误判
/* 【新增】色度差阈值：过滤阴影。阴影只是把画面整体压暗（红蓝通道相对背景几乎不变），
   色度差很小；只有"亮度差 + 色度差"同时超过阈值才判为障碍，影子不再误报 */
const SHADOW_CHROMA_THRESHOLD=18;
const GEN_MIN_AREA_BLOCKS=10;   // 【调高】原6→10，滤掉更多孤立噪点框
const GEN_MIN_W_BLOCKS=2;
const GEN_MIN_H_BLOCKS=2;
const BG_ABSORB_RATE=0.08;
let bgModel=null;
const GEN_DANGER_DIST=2.5;
const GEN_SPEAK_DIST=6;         // 【调近】原12→6，只播近处通用障碍
let genCanvas=null,genCtx=null;
/* ============================================================
   语音
   ============================================================ */
let supportTTS=!!window.speechSynthesis;
let ttsWarmedUp=false;
let preferredVoice=null;
function loadVoices(){
 if(!supportTTS)return;
 const voices=speechSynthesis.getVoices();
 preferredVoice=null;
 if(!voices.length)return;
 const androidZh=["google","普通话","zh-cn","zh-Hans"];
 for(let v of voices){const n=v.name.toLowerCase(),l=v.lang.toLowerCase();
   if(l.startsWith("zh")){ if(androidZh.some(k=>n.includes(k))){preferredVoice=v;break;} if(!preferredVoice)preferredVoice=v; } }
 if(!preferredVoice)preferredVoice=voices.find(v=>v.lang.startsWith("zh"))||null;
}
if(supportTTS){speechSynthesis.addEventListener('voiceschanged',loadVoices);loadVoices();}
const video=document.getElementById('video'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const logDiv=document.getElementById('log'),statusText=document.getElementById('statusText');
const statusDot=document.getElementById('statusDot');
const aiTip=document.getElementById('aiTip');
const btnStart=document.getElementById('btnStart'),btnStartText=document.getElementById('btnStartText'),btnStartSub=document.getElementById('btnStartSub');
const btnNav=document.getElementById('btnNav'),sosBtn=document.getElementById('sosBtn'),camBox=document.getElementById('camBox');
const nowIcon=document.getElementById('nowIcon'),nowTitle=document.getElementById('nowTitle'),nowSubEl=document.getElementById('nowSub');
const dangerBanner=document.getElementById('dangerBanner'),dangerText=document.getElementById('dangerText');
const logHead=document.getElementById('logHead'),logBody=document.getElementById('logBody');
const toast=document.getElementById('toast');
let model=null,running=false,isVoice=false,lastObjects=[],lastAiTime=0;
/* 【新增】跨帧跟踪对象列表：每个稳定障碍一条，位置经平滑后锁定 */
let trackers=[];
let trackerId=0;
/* 【新增】通用障碍（虚线框）的跟踪列表 */
let genTracks=[];
let genTid=0;
/* ====== 播报状态：全局限速 + 时域稳定确认 ====== */
let track=new Map();
const GLOBAL_COOLDOWN=6000;         // 【调慢】普通语音最小间隔(ms) 原2800→6000
const GLOBAL_COOLDOWN_DANGER=4000;  // 【调慢】危险语音最小间隔(ms) 原1400→4000
let lastGlobalSpeakTime=0;
let objConfirm=new Map();
const CONFIRM_WINDOW=900;
const CONFIRM_MIN=2;
function log(m,cls){
 const d=new Date();
 const t=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2);
 const span=document.createElement('span');
 span.className=cls||'info';
 span.textContent="["+t+"] "+m+"\n";
 logDiv.appendChild(span);
 logDiv.scrollTop=logDiv.scrollHeight;
 if(logDiv.childNodes.length>200) logDiv.firstChild.remove();
}
logHead.onclick=()=>{const o=logBody.classList.toggle('open');logHead.setAttribute('aria-expanded',o);logHead.querySelector('.chev').style.transform=o?'rotate(180deg)':'';};
logHead.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();logHead.onclick()}};
/* ====== 语音队列 ====== */
class VQ{
 constructor(){this.q=[];this.p=false;}
 speak(t,urgent){
  if(!supportTTS){log("设备不支持语音播报","warn");return;}
  try{speechSynthesis.resume();}catch(e){}
  if(!ttsWarmedUp){ttsWarmedUp=true;try{const w=new SpeechSynthesisUtterance(" ");w.volume=0;w.rate=2;speechSynthesis.speak(w);}catch(e){}}
  if(urgent){this.q=[];try{speechSynthesis.cancel();}catch(e){}this.p=false;}
  this.q.push(t);
  if(!this.p)this.go();
 }
 go(){
  if(!this.q.length){this.p=false;return;}
  this.p=true;
  const u=new SpeechSynthesisUtterance(this.q.shift());
  u.lang="zh-CN";u.rate=1.12;u.pitch=1.0;
  if(preferredVoice)u.voice=preferredVoice;
  try{speechSynthesis.resume();}catch(e){}
  let done=false;
  const next=()=>{if(done)return;done=true;setTimeout(()=>this.go(),180);};
  u.onend=()=>next();
  u.onerror=e=>{log("语音异常:"+e.error,"warn");next();};
  const est=Math.max(2000,u.text.length*200);
  setTimeout(next,est);
  speechSynthesis.speak(u);
 }
}
const vq=new VQ();
function speak(t,urgent){
 const now=Date.now();
 const gap=now-lastGlobalSpeakTime;
 const minGap=urgent?GLOBAL_COOLDOWN_DANGER:GLOBAL_COOLDOWN;
 if(gap<minGap)return;   // 全局限速，杜绝连续连念
 lastGlobalSpeakTime=now;
 try{vq.speak(t,urgent);}catch(e){log("语音报错："+e.message,"warn")}
}
/* ====== 时域稳定确认 ====== */
function confirm(key){
 const now=Date.now();
 let e=objConfirm.get(key);
 if(!e){e={seen:1,lastAt:now};objConfirm.set(key,e);return false;}
 if(now-e.lastAt>CONFIRM_WINDOW){e.seen=1;} else {e.seen++;}
 e.lastAt=now;
 return e.seen>=CONFIRM_MIN;
}
function pruneConfirm(now){
 if(now%5)return;
 for(const[k,e]of objConfirm.entries()){if(now-e.lastAt>CONFIRM_WINDOW*4)objConfirm.delete(k);}
}
/* ============================================================
   基础工具
   ============================================================ */
function clockDir(nx){
 const c=Math.round(((nx-0.5)*2*90)/30);
 if(c===0)return 12;
 return c>0?c:12+c;
}
function getFocal(vh){return (vh/2)/Math.tan(VFOV/2);}
function getDist(cls,h,vh){
 const known=KNOWN[cls]||0.8;
 if(h<=0)return 99;
 const fp=(vh/2)/Math.tan(VFOV/2);
 return Math.max(0.3,(known*fp)/h);
}
function getPixelDist(x1,y1,x2,y2){return Math.hypot(x1-x2,y1-y2);}
function iou(a,b){
 const x1=Math.max(a.x,b.x),y1=Math.max(a.y,b.y),x2=Math.min(a.x+a.w,b.x+b.w),y2=Math.min(a.y+a.h,b.y+b.h);
 const iw=Math.max(0,x2-x1),ih=Math.max(0,y2-y1),i=iw*ih;
 const u=a.w*a.h+b.w*b.h-i;
 return u?i/u:0;
}
/* ============================================================
   通用障碍检测（背景建模 + 帧间运动检测）
   ============================================================ */
function analyzeGeneric(vw,vh){
 const gw=Math.ceil(vw/BLOCK),gh=Math.ceil(vh/BLOCK);
 if(!genCanvas){genCanvas=document.createElement('canvas');genCtx=genCanvas.getContext('2d',{willReadFrequently:true});}
 genCanvas.width=gw;genCanvas.height=gh;
 genCtx.drawImage(video,0,0,gw,gh);
 const img=genCtx.getImageData(0,0,gw,gh).data;
 const N=gw*gh;
 /* 【阴影过滤】背景建模存 RGB 三通道；前景判定要求"亮度差+色度差"同时超标。
    阴影只会把画面同向压暗（红蓝通道相对背景几乎不变，色度差≈0），故被滤除，不播报 */
 const raw=new Float32Array(N*3);
 const lum=new Float32Array(N);
 for(let i=0;i<N;i++){
  const r=img[i*4],g=img[i*4+1],b=img[i*4+2];
  raw[i*3]=r;raw[i*3+1]=g;raw[i*3+2]=b;
  lum[i]=0.299*r+0.587*g+0.114*b;
 }
 if(!bgModel||bgModel.length!==N*3){bgModel=new Float32Array(raw);return [];}
 const diff=new Uint8Array(N);
 let change=0;
 for(let i=0;i<N;i++){
  const r=raw[i*3],b=raw[i*3+2];
  const bgr=bgModel[i*3],bgb=bgModel[i*3+2];
  const bdiff=Math.abs(lum[i]-(0.299*bgModel[i*3]+0.587*bgModel[i*3+1]+0.114*bgb));
  const cdiff=Math.abs(r-bgr)+Math.abs(b-bgb);   // 红蓝通道色度差：阴影≈0
  if(bdiff>BG_DIFF_THRESHOLD && cdiff>SHADOW_CHROMA_THRESHOLD){diff[i]=1;change++;}
 }
 const moveRatio=change/N;
 const rate = moveRatio<0.04 ? BG_ABSORB_RATE : 0;
 if(rate>0){
  let didAbsorb=false;
  for(let i=0;i<N;i++){
   if(!diff[i]){
    bgModel[i*3]=bgModel[i*3]*(1-rate)+raw[i*3]*rate;
    bgModel[i*3+1]=bgModel[i*3+1]*(1-rate)+raw[i*3+1]*rate;
    bgModel[i*3+2]=bgModel[i*3+2]*(1-rate)+raw[i*3+2]*rate;
    didAbsorb=true;
   }
  }
  if(moveRatio<0.008&&!didAbsorb){
   for(let i=0;i<N;i++){
    bgModel[i*3]=bgModel[i*3]*(1-rate)+raw[i*3]*rate;
    bgModel[i*3+1]=bgModel[i*3+1]*(1-rate)+raw[i*3+1]*rate;
    bgModel[i*3+2]=bgModel[i*3+2]*(1-rate)+raw[i*3+2]*rate;
   }
  }
 }
 if(change<GEN_MIN_AREA_BLOCKS)return [];
 const seen=new Uint8Array(N);
 const boxes=[];
 for(let y=0;y<gh;y++)for(let x=0;x<gw;x++){
  const idx=y*gw+x;
  if(!diff[idx]||seen[idx])continue;
  let minX=x,maxX=x,minY=y,maxY=y,cnt=0;
  const stack=[idx];seen[idx]=1;
  while(stack.length){
   const p=stack.pop();const px=p%gw,py=(p/gw)|0;cnt++;
   if(px<minX)minX=px;if(px>maxX)maxX=px;if(py<minY)minY=py;if(py>maxY)maxY=py;
   const nb=[[px+1,py],[px-1,py],[px,py+1],[px,py-1]];
   for(let k=0;k<4;k++){
    const nx=nb[k][0],ny=nb[k][1];
    if(nx<0||ny<0||nx>=gw||ny>=gh)continue;
    const ni=ny*gw+nx;
    if(diff[ni]&&!seen[ni]){seen[ni]=1;stack.push(ni);}
   }
  }
  if(cnt<GEN_MIN_AREA_BLOCKS)continue;
  const bw=maxX-minX+1,bh=maxY-minY+1;
  if(bw<GEN_MIN_W_BLOCKS||bh<GEN_MIN_H_BLOCKS)continue;
  const x2=minX*BLOCK,y2=minY*BLOCK,w2=bw*BLOCK,h2=bh*BLOCK;
  if(w2<8||h2<8)continue;
  const cx=x2+w2/2,cy=y2+h2/2,bottomY=cy+h2/2;
  const horizonY=vh*0.42;
  /* 【修复】改用"底部位置"估距：越靠画面下方越近、越靠上越远；
     不再用"假设障碍0.9米高"反推，避免障碍占高时距离被压到0.5米 */
  let distEst;
  if(bottomY<=horizonY)distEst=14;
  else{const ratio=(bottomY-horizonY)/(vh-horizonY);distEst=0.8+(1-ratio)*11;}
  const dist=Math.min(14,Math.max(0.8,distEst));
  const danger=dist<GEN_DANGER_DIST||(h2/vh)>0.22;
  boxes.push({x:x2,y:y2,w:w2,h:h2,cx,cy,nx:cx/vw,dir:clockDir(cx/vw),dist,danger,
   isFrontArea:(clockDir(cx/vw)>=FRONT_START||clockDir(cx/vw)<=FRONT_END)});
 }
 return boxes;
}
/* ============================================================
   墙体检测
   ============================================================ */
const WALL_REF_HEIGHT=2.4;
const WALL_DANGER_DIST=3;
const WALL_DIFF=30;
const WALL_MIN_ROWS=6;
const WALL_STEP=3;
const WALL_MIN_HEIGHT_RATIO=0.2;
let wallCanvas=null,wallCtx=null;
function analyzeWall(vw,vh){
 if(!bgModel||bgModel.length===0)return null;
 if(!video.videoWidth)return null;
 const sw=96,sh=Math.max(32,Math.floor(sw*vh/vw));
 if(!wallCanvas){wallCanvas=document.createElement('canvas');wallCtx=wallCanvas.getContext('2d',{willReadFrequently:true});}
 wallCanvas.width=sw;wallCanvas.height=sh;
 wallCtx.drawImage(video,0,0,sw,sh);
 const img=wallCtx.getImageData(0,0,sw,sh).data;
 let r=0,g=0,b=0,n=0;
 const gh=Math.max(4,Math.floor(sh*0.14));
 for(let y=sh-gh;y<sh;y+=2)for(let x=0;x<sw;x+=3){const i=(y*sw+x)*4;r+=img[i];g+=img[i+1];b+=img[i+2];n++;}
 if(!n)return null;
 r/=n;g/=n;b/=n;
 if((r+g+b)/3<26)return null;
 let runY0=-1,runLen=0,runY1=-1,found=false;
 for(let y=sh-1;y>=0;y-=WALL_STEP){
  let rr=0,gg=0,bb=0;
  for(let x=0;x<sw;x+=2){const i=(y*sw+x)*4;rr+=img[i];gg+=img[i+1];bb+=img[i+2];}
  const cnt=Math.ceil(sw/2);rr/=cnt;gg/=cnt;bb/=cnt;
  const d=Math.sqrt((rr-r)*(rr-r)+(gg-g)*(gg-g)+(bb-b)*(bb-b));
  if(d>WALL_DIFF){
   if(runLen===0)runY0=y;
   runLen++;
   if(y===0){runY1=0;found=true;break;}
  }else{
   if(runLen>=WALL_MIN_ROWS){runY1=y+WALL_STEP;found=true;break;}
   runLen=0;runY0=-1;
  }
 }
 if(!found||runLen<WALL_MIN_ROWS)return null;
 const wallH=runY0-runY1+WALL_STEP;
 const ratio=wallH/sh;
 if(ratio<WALL_MIN_HEIGHT_RATIO)return null;
 const wallPx=ratio*vh;
 const fp=getFocal(vh);
 const dist=Math.max(0.3,WALL_REF_HEIGHT*fp/wallPx);
 return {dist,ratio,base:runY0,top:runY1};
}

function localSuggest(objs){
 if(!objs.length)return"";
 const danger=objs.filter(o=>o.danger);
 if(danger.length){const d=danger[0];return"危险！前方"+d.dist.toFixed(1)+"米有"+d.cn+"，请停下绕行。";}
 const front=objs.filter(o=>o.dir==="正前方"&&o.dist<SPEAK_DIST);
 if(front.length){const f=front[0];return"正前方"+f.dist.toFixed(1)+"米有"+f.cn+"，放慢速度避让。";}
 return"";   // 无重要障碍不播报
}
async function runAi(){
 const objs=lastObjects;
 if(!objs.length){aiTip.textContent="AI安全解说：画面无障碍物，可以前行。";return;}
 const reply=localSuggest(objs);
 if(!reply){aiTip.textContent="AI安全解说：路况正常，注意脚下。";return;}  // 【精简】安全不播报
 aiTip.textContent="AI建议："+reply;
 speak(reply,false);log("AI建议："+reply);
}

function setNow(state,title,sub){nowIcon.className=state;nowTitle.textContent=title;nowSubEl.textContent=sub||''}
const showDanger=t=>{dangerText.textContent=t;dangerBanner.classList.add('show')};
const hideDanger=()=>dangerBanner.classList.remove('show');
/* ============================================================
   主循环
   ============================================================ */
async function loop(){
 if(!running)return;
 if(!model||!video.srcObject||!video.videoWidth){setTimeout(loop,LOOP_DELAY);return;}
 try{
  /* 【精简】置信度0.2→0.6，结果上限40→15，大幅减少误识别 */
  const preds=await model.detect(video,15,0.6,0.5);
  const vw=video.videoWidth,vh=video.videoHeight;
  canvas.width=vw;canvas.height=vh;ctx.clearRect(0,0,vw,vh);
  const now=Date.now();let objs=[];
  pruneConfirm(now);
  /* ---- A. COCO 物体（跨帧跟踪 + 位置平滑：锁定障碍，框不再乱跳） ---- */
  const dets=[];
  for(let o of preds){
   if(targetClasses.indexOf(o.class)<0)continue;
   const [x,y,w,h]=o.bbox;
   dets.push({cls:o.class,cn:CLASS_CN[o.class],x,y,w,h,cx:x+w/2,cy:y+h/2});
  }
  /* 1) 现有跟踪对象与当前帧检测匹配（按 IoU 归属同一个障碍） */
  const used=new Array(dets.length).fill(false);
  for(const tr of trackers){
   let best=-1,bestIoU=0;
   for(let i=0;i<dets.length;i++){
    if(used[i])continue;
    const v=iou({x:dets[i].x,y:dets[i].y,w:dets[i].w,h:dets[i].h},{x:tr.x,y:tr.y,w:tr.w,h:tr.h});
    if(v>bestIoU){bestIoU=v;best=i;}
   }
   if(best>=0&&bestIoU>=TRACK_IOU_MATCH){
    const d=dets[best];used[best]=true;
    tr.cls=d.cls;tr.cn=d.cn;
    tr.x+=(d.x-tr.x)*TRACK_SMOOTH;      // 位置向新检测平滑移动，消除抖动
    tr.y+=(d.y-tr.y)*TRACK_SMOOTH;
    tr.w+=(d.w-tr.w)*TRACK_SMOOTH;
    tr.h+=(d.h-tr.h)*TRACK_SMOOTH;
    tr.cx=tr.x+tr.w/2;tr.cy=tr.y+tr.h/2;
    tr.seen++;tr.lastSeen=now;
   }
  }
  /* 2) 新检测作为新跟踪对象 */
  for(let i=0;i<dets.length;i++){
   if(used[i])continue;
   const d=dets[i];
   trackerId++;
   trackers.push({id:trackerId,cls:d.cls,cn:d.cn,x:d.x,y:d.y,w:d.w,h:d.h,cx:d.cx,cy:d.cy,seen:1,lastSeen:now});
  }
  /* 3) 清理长时间丢失的跟踪 */
  trackers=trackers.filter(tr=>(now-tr.lastSeen)<TRACK_LOST_TIMEOUT);
  /* 4) 只收集确认过的稳定障碍（暂不绘制，统一到最后只画最重要的一个） */
  for(const tr of trackers){
   if(tr.seen<TRACK_CONFIRM_MIN)continue;
   const x=tr.x,y=tr.y,w=tr.w,h=tr.h;
   const dist=getDist(tr.cls,h,vh);
   const danger=dist<DANGER||(h/vh)>DANGER_BOX_RATIO;
   const dir=clockDir(tr.cx/vw);
   const isFrontArea=(dir>=FRONT_START||dir<=FRONT_END);
   const objKey="tr"+tr.id;
   objs.push({cn:tr.cn,dist,dir,isFrontArea,danger,nx:tr.cx/vw,cls:tr.cls,objKey,bbox:{x,y,w,h},type:"coco"});
  }
  objs.sort((a,b)=>{ if(a.danger!==b.danger)return a.danger?-1:1; if(a.isFrontArea!==b.isFrontArea)return a.isFrontArea?-1:1; return a.dist-b.dist; });
  const top=objs[0];
  /* ---- B. 通用障碍（同样跨帧跟踪+平滑，锁定不乱跳） ---- */
  const rawGen=analyzeGeneric(vw,vh);
  const gused=new Array(rawGen.length).fill(false);
  for(const gt of genTracks){
   let best=-1,bestIoU=0;
   for(let i=0;i<rawGen.length;i++){
    if(gused[i])continue;
    const v=iou({x:rawGen[i].x,y:rawGen[i].y,w:rawGen[i].w,h:rawGen[i].h},{x:gt.x,y:gt.y,w:gt.w,h:gt.h});
    if(v>bestIoU){bestIoU=v;best=i;}
   }
   if(best>=0&&bestIoU>=0.25){
    const d=rawGen[best];gused[best]=true;
    gt.x+=(d.x-gt.x)*0.5;gt.y+=(d.y-gt.y)*0.5;
    gt.w+=(d.w-gt.w)*0.5;gt.h+=(d.h-gt.h)*0.5;
    gt.cx=gt.x+gt.w/2;gt.cy=gt.y+gt.h/2;
    gt.dist=d.dist;gt.danger=d.danger;
    gt.seen++;gt.lastSeen=now;
   }
  }
  for(let i=0;i<rawGen.length;i++){
   if(gused[i])continue;
   const d=rawGen[i];
   genTid++;
   genTracks.push({id:genTid,x:d.x,y:d.y,w:d.w,h:d.h,cx:d.cx,cy:d.cy,dist:d.dist,danger:d.danger,seen:1,lastSeen:now});
  }
  genTracks=genTracks.filter(gt=>(now-gt.lastSeen)<TRACK_LOST_TIMEOUT);
  const generic=[];
  for(const gt of genTracks){
   if(gt.seen<TRACK_CONFIRM_MIN)continue;
   const g={x:gt.x,y:gt.y,w:gt.w,h:gt.h,cx:gt.cx,cy:gt.cy,nx:gt.cx/vw,dir:clockDir(gt.cx/vw),
     dist:gt.dist,danger:gt.danger,isFrontArea:(clockDir(gt.cx/vw)>=FRONT_START||clockDir(gt.cx/vw)<=FRONT_END)};
   let dup=false;
   for(const o of objs){ if(iou(g,o.bbox)>0.3){dup=true;break;} }
   if(!dup){ generic.push({...g,type:"generic"}); }
  }
  /* ---- C. 墙体检测（暂不绘制，统一到最后只画最重要的一个） ---- */
  const candidates=[];
  const wall=analyzeWall(vw,vh);
  if(wall){
   wall.by=wall.top*(vh/(Math.max(32,Math.floor(96*vh/vw))));
   wall.bh=(wall.base-wall.top)*(vh/(Math.max(32,Math.floor(96*vh/vw))));
   if(wall.dist<WALL_DANGER_DIST){
    const wkey="wall_"+Math.round(wall.dist*2);
    if(confirm(wkey)){
     candidates.push({type:"wall",dist:wall.dist,danger:true,
      speakText:"危险！正前方墙体，约"+wall.dist.toFixed(1)+"米，请停下",key:wkey});
    }
   }
  }
  /* 候选2：COCO 障碍 —— 【精简】只有正前方 SPEAK_DIST 米内才播 */
  if(top&&top.isFrontArea&&top.dist<SPEAK_DIST){
   const okey="c_"+top.objKey;
   if(confirm(okey)){
    const clockName=(top.dir===12)?"十二点钟方向":(top.dir+"点钟方向");
    const prefix=top.danger?"危险！":"注意：";
    const txt=prefix+clockName+"，"+top.dist.toFixed(1)+"米，有障碍物，请绕行";
    candidates.push({type:"coco",dist:top.dist,danger:top.danger,speakText:txt,key:okey});
   }
  }
  let genFront=null;
  for(const g of generic){if(g.isFrontArea&&(!genFront||g.dist<genFront.dist))genFront=g;}
  if(genFront&&genFront.dist<GEN_SPEAK_DIST){
   const gkey="g_"+Math.round(genFront.nx*12)+"_"+Math.round((genFront.h/vh)*18);
   if(confirm(gkey)){
    const clockName=(genFront.dir===12)?"十二点钟方向":(genFront.dir+"点钟方向");
    const txt=(genFront.danger?"危险！":"注意：")+clockName+"，约"+genFront.dist.toFixed(1)+"米，有障碍物，请绕行";
    candidates.push({type:"generic",dist:genFront.dist,danger:genFront.danger,speakText:txt,key:gkey});
   }
  }
  candidates.sort((a,b)=>{ if(a.danger!==b.danger)return a.danger?-1:1; return a.dist-b.dist; });
  const best=candidates[0];
  if(best){
   if(now-(track.get(best.key)||0)>=COOLDOWN){
    track.set(best.key,now);
    speak(best.speakText,best.danger);
    log(best.speakText,best.danger?"danger":"warn");
   }
  }
  /* ---- 【新增】画面只保留一个框：只画最高优先级那个障碍，不再满屏框 ---- */
  let showT=best?best:(top?{type:"coco"}:null);
  if(showT){
   if(showT.type==="wall"&&wall){
    ctx.setLineDash([12,8]);ctx.strokeStyle="#ff5a5c";ctx.lineWidth=4;
    ctx.strokeRect(0,wall.by,vw,wall.bh);
    ctx.fillStyle="#ff5a5c";ctx.font="16px sans-serif";
    ctx.fillText("墙体 ~"+wall.dist.toFixed(1)+"m",12,wall.by+22);
    ctx.setLineDash([]);
   }else if(showT.type==="coco"&&top){
    const b=top.bbox;
    ctx.strokeStyle=top.danger?"#ff4d4f":"#ffd166";
    ctx.lineWidth=3;ctx.strokeRect(b.x,b.y,b.w,b.h);
    ctx.fillStyle=ctx.strokeStyle;ctx.font="15px sans-serif";
    ctx.fillText(top.cn+" "+top.dist.toFixed(1)+"m",b.x,b.y-6);
   }else if(showT.type==="generic"&&genFront){
    ctx.setLineDash([8,6]);
    ctx.strokeStyle=genFront.danger?"#ff5a5c":"#2ecc8f";
    ctx.lineWidth=3;ctx.strokeRect(genFront.x,genFront.y,genFront.w,genFront.h);
    ctx.fillStyle=ctx.strokeStyle;ctx.font="13px sans-serif";
    ctx.fillText("障碍 "+genFront.dist.toFixed(1)+"m",genFront.x,genFront.y-5);
    ctx.setLineDash([]);
   }
  }
  /* ---- D. 状态卡片 / 危险横幅 ---- */
  if(wall&&wall.dist<WALL_DANGER_DIST){
   showDanger("危险！正前方墙体约"+wall.dist.toFixed(1)+"米");
   setNow("danger","正前方墙体 "+wall.dist.toFixed(1)+"米","危险！请停下");
  }else if(top&&top.isFrontArea){
   const dirLabel=(top.dir===12)?"十二点钟方向":(top.dir+"点钟");
   const t=dirLabel+" "+top.dist.toFixed(1)+"米 · "+top.cn;
   if(top.danger){setNow("danger",t,"危险！停下绕行");showDanger("危险！"+dirLabel+"有障碍物");}
   else{setNow("warn",t,"注意障碍，放慢速度");hideDanger();}
  }else if(genFront){
   const dirLabel=(genFront.dir===12)?"十二点钟方向":(genFront.dir+"点钟");
   const t=dirLabel+" "+genFront.dist.toFixed(1)+"米 · 障碍物";
   if(genFront.danger){setNow("danger",t,"危险！停下绕行");showDanger("危险！"+dirLabel+"有障碍物");}
   else{setNow("warn",t,"注意障碍，放慢速度");hideDanger();}
  }else if(top&&top.danger){
   setNow("danger","侧方危险物 "+top.dist.toFixed(1)+"米","请小心绕行");showDanger("危险！"+top.cn+"障碍物");
  }else{
   setNow("ok","前方畅通","无正前方障碍物，请继续行走");hideDanger();
  }
  lastObjects=objs.map(o=>({cn:o.cn,dist:o.dist,dir:o.dir===12?"正前方":o.dir+"点钟方向",danger:o.danger}));
  for(const[k,t]of track.entries()){if(now-t>COOLDOWN*3)track.delete(k);}
  if(now-lastAiTime>=AI_INTERVAL){lastAiTime=now;if(lastObjects.length)runAi();}
 }catch(err){log("识别出错:"+err.message,"warn")}
 if(window.speechSynthesis&&Date.now()-lastGlobalSpeakTime>2500){try{speechSynthesis.resume();}catch(e){}}
 setTimeout(loop,LOOP_DELAY);
}

let sosPressTimer=null;
const askPhone=()=>{
 const p=prompt("设置紧急联系人手机号：",sosPhone||"");
 if(p){sosPhone=p.trim();localStorage.setItem("sosPhone",sosPhone);speak("紧急联系人已设置",true);log("紧急联系人已设置："+sosPhone,"ok");return true;}
 return false;
};
sosBtn.addEventListener("touchstart",e=>{
 e.preventDefault();
 sosPressTimer=setTimeout(()=>{
  navigator.vibrate&&navigator.vibrate(80);
  if(askPhone()){toastShow("联系人已更新");}
 },700);
},{passive:false});
sosBtn.addEventListener("touchend",e=>{clearTimeout(sosPressTimer);},false);
sosBtn.onclick=function(){
 if(!sosPhone){if(askPhone()){speak("联系人已设置，再次点击即可拨打",false);toastShow("请再次点击拨打");}return;}
 speak("正在拨打紧急联系人",true);log("拨打 "+sosPhone,"danger");
 window.location.href="tel:"+sosPhone;
};
sosBtn.oncontextmenu=e=>e.preventDefault();
let lastTap=0;
document.addEventListener("touchend",e=>{
 const t=Date.now();
 if(t-lastTap<320){pauseToggle();}
 lastTap=t;
});
function pauseToggle(){
 if(!running)return;
 running=false;
 btnStartText.textContent="开启播报";btnStartSub.textContent="识别重要障碍";
 btnStart.classList.remove('running');setStatus("已暂停");
 setNow("info","已暂停","双击继续播报");hideDanger();
 toastShow("已暂停");
}
let touchStartY=null,touchStartX=null;
camBox.addEventListener("touchstart",e=>{touchStartY=e.touches[0].clientY;touchStartX=e.touches[0].clientX;},{passive:true});
camBox.addEventListener("touchend",e=>{
 if(touchStartY==null)return;
 const dy=e.changedTouches[0].clientY-touchStartY;
 const dx=Math.abs(e.changedTouches[0].clientX-touchStartX);
 if(dx<60&&Math.abs(dy)>80){
  if(dy<0){toastShow("上滑 · 正在导航");btnNav.click();}
  else{sosBtn.click();}
 }
 touchStartY=null;touchStartX=null;
},{passive:true});
document.getElementById('btnTest').onclick=function(){
 speak("声音正常，这是测试播报。",true);
 log("已触发声音测试","ok");
};
let toastTimer=null;
function toastShow(t){
 toast.textContent=t;toast.classList.add('show');
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>toast.classList.remove('show'),1600);
}
setStatus("待开启");setNow("info","等待开启","开启后实时播报前方路况");
log("暖阳视界已就绪，点击【开启播报】开始识别", "ok");
})();
</script>
</body>
</html>
